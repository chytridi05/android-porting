plugins {
    id 'com.android.dynamic-feature' version '8.10.1'
}

android {
    namespace 'fixture.extension'
    compileSdk 36

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':app')
}
